    function initHeroForceField(){const canvas=$('#forceField');if(!canvas)return;const ctx=canvas.getContext('2d',{alpha:true});let particles=[],mouse={x:0,y:0,active:false,last:0},w=0,h=0,dpr=1;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){const r=canvas.getBoundingClientRect();w=Math.max(1,r.width);h=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,1.6);canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.max(58,Math.min(112,Math.floor(w*h/11000)));particles=Array.from({length:count},()=>{const x=rand(w*.08,w*.96),y=rand(h*.08,h*.9);return{x,y,ox:x,oy:y,vx:0,vy:0,r:rand(.7,1.55),a:rand(.12,.32),phase:rand(0,Math.PI*2)}})}function draw(t){ctx.clearRect(0,0,w,h);const pulse=mouse.active?1:Math.max(0,1-(performance.now()-mouse.last)/1300);for(const p of particles){const driftX=Math.sin(t*.00025+p.phase)*.22,driftY=Math.cos(t*.0002+p.phase)*.18;let tx=p.ox+driftX*18,ty=p.oy+driftY*16;if(mouse.active){const dx=mouse.x-p.x,dy=mouse.y-p.y,dist=Math.hypot(dx,dy)||1,range=210;if(dist<range){const f=(1-dist/range);const pull=dist<58?-36:82;p.vx+=dx/dist*f*pull*.004;p.vy+=dy/dist*f*pull*.004}}p.vx+=(tx-p.x)*.008;p.vy+=(ty-p.y)*.008;p.vx*=.88;p.vy*=.88;p.x+=p.vx;p.y+=p.vy}if(pulse>.02){for(let i=0;i<particles.length;i++){const a=particles[i],dam=Math.hypot(a.x-mouse.x,a.y-mouse.y);if(dam>230)continue;for(let j=i+1;j<particles.length;j++){const b=particles[j],dm=Math.hypot(b.x-mouse.x,b.y-mouse.y);if(dm>230)continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<76){ctx.strokeStyle=`rgba(176,188,255,${(1-d/76)*.18*pulse})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}}for(const p of particles){const near=mouse.active?Math.max(0,1-Math.hypot(p.x-mouse.x,p.y-mouse.y)/210):0;ctx.fillStyle=`rgba(${205+near*35|0},${212+near*28|0},${225+near*30|0},${p.a+near*.38})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r+near*1.35,0,Math.PI*2);ctx.fill()}if(pulse>.02){const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,250);g.addColorStop(0,`rgba(135,150,255,${.13*pulse})`);g.addColorStop(.42,`rgba(178,128,255,${.045*pulse})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(mouse.x-260,mouse.y-260,520,520)}requestAnimationFrame(draw)}canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.active=true;mouse.last=performance.now()});canvas.addEventListener('pointerleave',()=>{mouse.active=false;mouse.last=performance.now()});new ResizeObserver(resize).observe(canvas);resize();requestAnimationFrame(draw)}

    function initCarousels(){document.querySelectorAll('.section-carousel').forEach(carousel=>{const track=carousel.querySelector('.carousel-track'),cards=[...carousel.querySelectorAll('.highlight-card')],dots=[...carousel.querySelectorAll('.carousel-dot')],play=carousel.querySelector('.carousel-btn');let index=0,timer=null;const setActive=i=>{index=(i+cards.length)%cards.length;cards.forEach((card,idx)=>card.classList.toggle('active',idx===index));dots.forEach((dot,idx)=>dot.classList.toggle('active',idx===index))};const go=i=>{setActive(i);const card=cards[index],left=card.offsetLeft-(track.clientWidth-card.clientWidth)/2;track.scrollTo({left,behavior:'smooth'})};const stop=()=>{clearInterval(timer);timer=null;play.classList.remove('is-paused');play.setAttribute('aria-label','Play carousel')};const start=()=>{stop();timer=setInterval(()=>go(index+1),4200);play.classList.add('is-paused');play.setAttribute('aria-label','Pause carousel')};cards.forEach((card,i)=>card.onclick=()=>openModal(works.find(w=>w.id==card.dataset.id)));dots.forEach((dot,i)=>dot.onclick=()=>{stop();go(i)});play.onclick=()=>timer?stop():start();track.addEventListener('scroll',()=>{clearTimeout(track._snapTimer);track._snapTimer=setTimeout(()=>{const center=track.getBoundingClientRect().left+track.clientWidth/2;let nearest=0,dist=Infinity;cards.forEach((card,i)=>{const r=card.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-center);if(d<dist){dist=d;nearest=i}});setActive(nearest)},80)},{passive:true});setActive(0);start()})}

    window.openLightboxBySrc=src=>{const i=currentGallery.indexOf(src);currentLightboxIndex=i>=0?i:0;renderLightbox()}; function renderLightbox(){const l=$('#lightbox');const src=currentGallery[currentLightboxIndex];l.innerHTML=`<button class="close" style="position:absolute;right:28px;top:28px" onclick="closeLightbox()">✕</button>${currentGallery.length>1?`<button class="lightbox-arrow lightbox-prev" onclick="moveLightbox(-1)">‹</button><button class="lightbox-arrow lightbox-next" onclick="moveLightbox(1)">›</button><div class="lightbox-count">${currentLightboxIndex+1} / ${currentGallery.length}</div>`:''}<img src="${src}" alt="Preview">`;l.classList.add('open')} window.moveLightbox=dir=>{if(!currentGallery.length)return;currentLightboxIndex=(currentLightboxIndex+dir+currentGallery.length)%currentGallery.length;renderLightbox()}; window.closeLightbox=()=>$('#lightbox').classList.remove('open'); $('#lightbox').onclick=e=>{if(e.target.id==='lightbox')closeLightbox()};
