l ${icon('arrow')}</button><a class="btn" target="_blank" href="${profile.xiaohongshu}">Xiaohongshu</a><a class="btn" target="_blank" href="${profile.zcool}">Zcool</a><a class="btn" target="_blank" href="${profile.behance}">Behance</a></div></div></footer>`;
